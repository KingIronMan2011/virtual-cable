name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # ── 1. Check version and create a draft release ───────────────────────────
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}

    steps:
      - uses: actions/checkout@v5

      - name: Get version from package.json
        id: version
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Check if release already exists
        id: check
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "Release v${{ steps.version.outputs.version }} already exists — skipping."
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Release v${{ steps.version.outputs.version }} not found — will build."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create draft release
        if: steps.check.outputs.should_build == 'true'
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Build on each platform and upload assets ───────────────────────────
  build:
    name: Build — ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          # macos-latest is Apple Silicon (arm64).
          # The x64 build runs on all Macs via Rosetta 2 — use macos-13 if
          # you need to target Intel Macs natively.
          - name: macOS
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          npm_config_msvs_version: "2022"

      - name: Rebuild native addons
        run: npx electron-rebuild -f -w naudiodon
        env:
          npm_config_msvs_version: "2022"

      - name: Install 7-Zip (Windows — required by Squirrel)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install 7zip -y
          echo "C:\Program Files\7-Zip" >> $env:GITHUB_PATH

      - name: Build
        run: npm run make

      - name: Upload assets (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          gh release upload "v${{ needs.prepare.outputs.version }}" \
            out/make/squirrel.windows/x64/*.exe \
            out/make/squirrel.windows/x64/*.nupkg \
            out/make/squirrel.windows/x64/RELEASES \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets (macOS)
        if: runner.os == 'macOS'
        run: |
          gh release upload "v${{ needs.prepare.outputs.version }}" \
            $(find out/make/zip/darwin -name "*.zip") \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. Publish once all platform builds have uploaded ─────────────────────
  publish:
    name: Publish release
    needs: [prepare, build]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Publish release
        run: |
          gh release edit "v${{ needs.prepare.outputs.version }}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
