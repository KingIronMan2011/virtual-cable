name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a v prefix (for example, 1.4.6)
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      - name: Set release version
        id: version
        run: |
          requested="${{ inputs.version }}"
          echo "version=$requested" >> "$GITHUB_OUTPUT"

      - name: Ensure the release does not already exist
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Release v${{ steps.version.outputs.version }} already exists. Bump the version before releasing."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  build-windows:
    name: Build signed Windows installer
    needs: prepare
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build signed installer
        run: pnpm run build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Upload installer and updater signature
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [prepare, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: Create GitHub Release
        run: |
          installer=$(find release-assets -type f -name '*.exe' -print -quit)
          signature_file="${installer}.sig"

          if [[ -z "$installer" || ! -f "$signature_file" ]]; then
            echo "Expected an installer and its .sig file."
            exit 1
          fi

          installer_name=$(basename "$installer")
          installer_url_name=${installer_name// /%20}
          signature=$(tr -d '\r\n' < "$signature_file")
          cat > release-assets/updates.json << EOF
          {
            "version": "${{ needs.prepare.outputs.version }}",
            "notes": "See the GitHub Release for details.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$signature",
                "url": "https://github.com/${{ github.repository }}/releases/download/v${{ needs.prepare.outputs.version }}/$installer_url_name"
              }
            }
          }
          EOF

          jq empty release-assets/updates.json

          mapfile -t files < <(find release-assets -type f \( -name '*.exe' -o -name '*.sig' -o -name 'updates.json' \))
          gh release create "v${{ needs.prepare.outputs.version }}" \
            --title "Virtual Cable v${{ needs.prepare.outputs.version }}" \
            --generate-notes \
            "${files[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
