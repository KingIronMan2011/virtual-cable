name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # ── 1. Read version and decide whether to build ───────────────────────────
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}

    steps:
      - uses: actions/checkout@v5

      - name: Get version from package.json
        id: version
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Check if release already exists
        id: check
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "Release v${{ steps.version.outputs.version }} already exists — skipping."
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Release v${{ steps.version.outputs.version }} not found — will build."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Build the Windows installer ───────────────────────────────────────
  build-windows:
    name: Build — Windows
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # postinstall runs electron-rebuild for naudiodon + segfault-handler
        run: npm ci

      - name: Build installer
        run: npm run build

      - name: List build output
        shell: bash
        run: find src-tauri/target/release/bundle/nsis -type f | sort

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Virtual Cable_${{ needs.prepare.outputs.version }}_x64-setup
          path: src-tauri/target/release/bundle/nsis
          if-no-files-found: error

  # ── 3. Publish the GitHub release ─────────────────────────────────────────
  release:
    name: Release
    needs: [prepare, build-windows]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List downloaded artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub release
        run: |
          mapfile -t FILES < <(find artifacts -type f \( -name "*.exe" -o -name "*.nupkg" -o -name "RELEASES" -o -name "*.zip" \))
          echo "Uploading: ${FILES[*]}"
          gh release create "v${{ needs.prepare.outputs.version }}" \
            --title "v${{ needs.prepare.outputs.version }}" \
            --generate-notes \
            "${FILES[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
