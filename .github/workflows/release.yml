name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # ── 1. Read version and decide whether to build ───────────────────────────
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}

    steps:
      - uses: actions/checkout@v5

      - name: Get version from package.json
        id: version
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Check if release already exists
        id: check
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "Release v${{ steps.version.outputs.version }} already exists — skipping."
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Release v${{ steps.version.outputs.version }} not found — will build."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2a. Build the Windows installer ───────────────────────────────────────
  build-windows:
    name: Build — Windows
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # postinstall runs electron-rebuild for naudiodon + segfault-handler
        run: npm ci
        env:
          npm_config_msvs_version: "2022"

      - name: Build icons
        run: npm run build:icons

      - name: Build installer
        run: npm run make
        env:
          npm_config_msvs_version: "2022"

      - name: List build output
        shell: bash
        run: find out/make -type f | sort

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: squirrel-windows
          path: out/make/squirrel.windows/x64/
          if-no-files-found: error

  # ── 2b. Build the macOS zips (arm64 + x64 as separate native builds) ─────────
  # Building --arch universal with native modules like naudiodon fails because
  # @electron/universal requires identical mach-o file counts in both sub-packages,
  # but cross-compiling naudiodon (which links portaudio) produces a different file
  # structure on arm64 vs x64. Building on native hardware sidesteps all of that.
  build-macos:
    name: Build — macOS (${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest   # Apple Silicon runner
          - arch: x64
            runner: macos-13       # Intel runner

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native addons for ${{ matrix.arch }}
        run: npx electron-rebuild -f -w naudiodon,segfault-handler --arch ${{ matrix.arch }}

      - name: Build icons
        run: npm run build:icons

      - name: Build ${{ matrix.arch }} zip
        run: npm run make -- --arch ${{ matrix.arch }}

      - name: List build output
        run: find out/make -type f | sort

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zip-macos-${{ matrix.arch }}
          path: out/make/zip/darwin/${{ matrix.arch }}/
          if-no-files-found: error

  # ── 3. Publish the GitHub release ─────────────────────────────────────────
  release:
    name: Release
    needs: [prepare, build-windows, build-macos]
    # build-macos is a matrix job — all matrix entries must succeed
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          # Collects: squirrel-windows/, zip-macos-arm64/, zip-macos-x64/

      - name: List downloaded artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub release
        run: |
          mapfile -t FILES < <(find artifacts -type f \( -name "*.exe" -o -name "*.nupkg" -o -name "RELEASES" -o -name "*.zip" \))
          echo "Uploading: ${FILES[*]}"
          gh release create "v${{ needs.prepare.outputs.version }}" \
            --title "v${{ needs.prepare.outputs.version }}" \
            --generate-notes \
            "${FILES[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
