name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Generate updates.json
        run: |
          mkdir -p website/public
          VERSION=$(node -e "console.log(require('./package.json').version)")
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > website/public/updates.json << EOF
          {
            "version": "$VERSION",
            "notes": "Check website for release notes",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "windows-x86_64": {
                "signature": "dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IEIzQ0Q0NjA5MjBCMTY3QUYKUldTdlo3RWdDVWJOczFSYk1iSDRibUNKa2VXdU9aMlpPUmtYL1FWUE4rVktzbzJQVjdIWVNiWUMK",
                "url": "https://virtual-cable.kingironman.dev/releases/Virtual_Cable_${VERSION}_x64-setup.exe"
              }
            }
          }
          EOF
          echo "Generated updates.json for version $VERSION"

      - name: Build
        run: npm run build
        working-directory: website

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

      - uses: actions/deploy-pages@v4
        id: deploy
