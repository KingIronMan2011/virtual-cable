<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Cable gradient: amber → teal -->
    <linearGradient id="cable-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8a838"/>
      <stop offset="100%" stop-color="#3dd6c8"/>
    </linearGradient>

    <!-- Ambient glow behind cable -->
    <filter id="cable-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft halo behind each port -->
    <radialGradient id="amber-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8a838" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e8a838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3dd6c8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3dd6c8" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle background vignette -->
    <radialGradient id="bg-vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1710"/>
      <stop offset="100%" stop-color="#0c0b09"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg-vignette)"/>
  <rect width="32" height="32" rx="7" fill="none" stroke="#2a2419" stroke-width="0.75"/>

  <!-- Cable glow layer (blurred, behind everything) -->
  <path d="M7.5 23 C7.5 11 24.5 11 24.5 23"
    stroke="url(#cable-grad)" stroke-width="4" fill="none"
    stroke-linecap="round" opacity="0.18" filter="url(#cable-glow)"/>

  <!-- Cable main line -->
  <path d="M7.5 23 C7.5 11 24.5 11 24.5 23"
    stroke="url(#cable-grad)" stroke-width="1.6" fill="none"
    stroke-linecap="round" filter="url(#cable-glow)"/>

  <!-- Signal pulse: small dot at the top of the arc (midpoint y=11) -->
  <circle cx="16" cy="11" r="1.4" fill="white" opacity="0.45"/>

  <!-- Amber port halo -->
  <circle cx="7.5" cy="23" r="6" fill="url(#amber-halo)"/>

  <!-- Amber port — outer ring -->
  <circle cx="7.5" cy="23" r="3.8" fill="#c48820"/>
  <!-- Amber port — face highlight -->
  <circle cx="7.5" cy="23" r="3.8" fill="#e8a838" opacity="0.85"/>
  <!-- Amber port — inner dark bore -->
  <circle cx="7.5" cy="23" r="2.1" fill="#0c0b09"/>
  <!-- Amber port — inner contact dot -->
  <circle cx="7.5" cy="23" r="1" fill="#e8a838" opacity="0.7"/>

  <!-- Teal port halo -->
  <circle cx="24.5" cy="23" r="6" fill="url(#teal-halo)"/>

  <!-- Teal port — outer ring -->
  <circle cx="24.5" cy="23" r="3.8" fill="#23a89c"/>
  <!-- Teal port — face highlight -->
  <circle cx="24.5" cy="23" r="3.8" fill="#3dd6c8" opacity="0.85"/>
  <!-- Teal port — inner dark bore -->
  <circle cx="24.5" cy="23" r="2.1" fill="#0c0b09"/>
  <!-- Teal port — inner contact dot -->
  <circle cx="24.5" cy="23" r="1" fill="#3dd6c8" opacity="0.7"/>
</svg>
